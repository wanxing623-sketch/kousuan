<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <meta name="description" content="速算练习：打字或语音作答的口算练习，支持两位数与三位数加减。语音在手机本地识别，不联网。">
  <title>速算练习</title>
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <span class="brand">速算练习</span>
    </header>

    <!-- 设置 -->
    <section id="setup" class="view">
      <div class="field">
        <h2 class="field-label">练习方式</h2>
        <div class="mode-grid">
          <button class="mode-card is-active" type="button" data-mode="typing" aria-pressed="true">
            <span class="mode-title">打字作答</span>
            <span class="mode-desc">看题后用数字键输入</span>
          </button>
          <button class="mode-card" type="button" data-mode="voice" aria-pressed="false">
            <span class="mode-title">语音作答</span>
            <span class="mode-desc">看题后直接说出答案</span>
          </button>
        </div>
        <p id="voice-note" class="note" hidden></p>
      </div>

      <div class="field">
        <h2 class="field-label">题目难度</h2>
        <div class="list-card" role="radiogroup" aria-label="题目难度">
          <button class="list-row is-active" type="button" role="radio" aria-checked="true" data-level="two">
            <span class="radio" aria-hidden="true"></span>
            <span class="list-label">两位数 ± 两位数</span>
            <span class="list-hint">47 + 36</span>
          </button>
          <button class="list-row" type="button" role="radio" aria-checked="false" data-level="mixed">
            <span class="radio" aria-hidden="true"></span>
            <span class="list-label">两位数 ± 三位数</span>
            <span class="list-hint">385 − 27</span>
          </button>
          <button class="list-row" type="button" role="radio" aria-checked="false" data-level="three">
            <span class="radio" aria-hidden="true"></span>
            <span class="list-label">三位数 ± 三位数</span>
            <span class="list-hint">648 + 293</span>
          </button>
        </div>
      </div>

      <div class="field">
        <h2 class="field-label">题目数量</h2>
        <div class="segmented" role="radiogroup" aria-label="题目数量">
          <button class="segment is-active" type="button" role="radio" aria-checked="true" data-count="10">10 题</button>
          <button class="segment" type="button" role="radio" aria-checked="false" data-count="20">20 题</button>
          <button class="segment" type="button" role="radio" aria-checked="false" data-count="30">30 题</button>
          <button class="segment" type="button" role="radio" aria-checked="false" data-count="0">不限</button>
        </div>
      </div>
    </section>

    <!-- 练习 -->
    <section id="practice" class="view" hidden>
      <div class="practice-head">
        <span id="progress-label">第 1 / 10 题</span>
        <span id="timer-label">00:00</span>
      </div>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

      <div class="card question-card">
        <p id="question" class="question" aria-live="polite">47 + 36 = ?</p>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </div>

      <p id="heard" class="heard" aria-live="polite"></p>

      <div class="practice-links">
        <button id="switch-typing" class="link" type="button" hidden>改用打字</button>
        <button id="skip-button" class="link" type="button">跳过这题</button>
        <button id="quit-button" class="link" type="button">结束</button>
      </div>

      <div id="voice-loading" class="voice-loading" hidden>
        <p id="voice-loading-text" class="voice-loading-text">正在准备离线语音…</p>
        <div class="loading-bar"><span></span></div>
        <p class="note">首次使用需下载约 42MB 语音模型，之后打开直接可用。声音只在本机识别，不上传。</p>
        <button id="voice-cancel" class="link" type="button">先用打字作答</button>
      </div>
    </section>

    <!-- 结果 -->
    <section id="results" class="view" hidden>
      <h1 class="result-title">练习完成</h1>
      <div class="card stat-card">
        <div class="stat">
          <strong id="stat-accuracy">0%</strong>
          <span>正确率</span>
        </div>
        <div class="stat">
          <strong id="stat-time">00:00</strong>
          <span>用时</span>
        </div>
      </div>
      <p id="result-sub" class="result-sub"></p>
    </section>

    <!-- 底部操作条 -->
    <div class="dock" id="dock">
      <button id="start-button" class="primary" type="button">开始练习</button>

      <form id="dock-typing" class="dock-row" hidden autocomplete="off">
        <input id="answer" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" spellcheck="false" placeholder="输入答案" aria-label="输入答案">
        <button id="submit-button" class="primary compact" type="submit">确认</button>
      </form>

      <button id="mic-button" class="primary mic" type="button" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="mic-label">正在聆听，请说答案</span>
      </button>

      <button id="again-button" class="primary" type="button" hidden>再练一组</button>
    </div>
    <button id="settings-button" class="link back-link" type="button" hidden>返回设置</button>
  </main>

  <script src="vendor/vosk.js"></script>
  <script src="app.js"></script>
</body>
</html>
