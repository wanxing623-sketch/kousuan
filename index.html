<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta name="description" content="两位数、三位数的加减法口算练习，支持键盘输入与语音作答。">
  <title>速算练习</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="速算练习">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
:root {
  --ink: #222a3b;
  --ink-soft: #4a5266;
  --muted: #858b9b;
  --muted-2: #a0a5b2;
  --orange: #f47b50;
  --orange-dark: #e7683f;
  --orange-wash: #fff0e9;
  --lavender: #f1efff;
  --lavender-ink: #6958cb;
  --line: #e9ebf1;
  --line-soft: #f0f1f5;
  --green: #45a778;
  --red: #e7683f;
  --radius: 18px;
  font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC",
    "Source Han Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--ink);
  background: #f7f8fb;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  min-height: 100dvh;
  background: radial-gradient(ellipse at 53% 0%, #fff 0, #f8f8fc 46%, #f5f7fb 100%);
  color: var(--ink);
  line-height: 1.5;
}

h1, h2, p, ul { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.app-shell {
  width: calc(100% - 40px);
  width: min(100% - 40px, 680px);
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 0;
  padding: calc(24px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */

.topbar {
  display: flex;
  align-items: center;
  min-height: 38px;
  padding: 0 2px 18px;
}

.brand {
  display: inline-flex;
  align-items: center;
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .01em;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 29px;
  margin-right: 10px;
  height: 29px;
  border-radius: 9px;
  background: var(--orange-wash);
  color: var(--orange);
  font-size: 22px;
  font-weight: 500;
  line-height: 1;
  box-shadow: 0 2px 8px rgba(244, 123, 80, .09);
}

/* ---------- panel ---------- */

.panel {
  border: 1px solid #eff0f4;
  border-radius: var(--radius);
  background: #fff;
  box-shadow: 0 13px 42px rgba(40, 50, 75, .045);
}

.setup-panel { padding: 24px 28px 18px; }

.setting-group {
  min-width: 0;
  margin: 0 0 20px;
  padding: 0;
  border: 0;
}

.setting-group legend {
  width: 100%;
  margin-bottom: 11px;
  padding: 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: .01em;
}

/* ---------- mode cards ---------- */

.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.mode-card {
  display: flex;
  align-items: center;
  height: 70px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fff;
  text-align: left;
  transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
}

.mode-card:hover { border-color: #f5c3b1; }

.mode-card.selected {
  border-color: var(--orange);
  background: #fffaf7;
  box-shadow: 0 0 0 2px rgba(244, 123, 80, .06);
}

.mode-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 34px;
  height: 34px;
  margin-right: 11px;
  border-radius: 10px;
  background: var(--orange-wash);
  color: var(--orange);
}

.mode-icon.voice-icon { background: var(--lavender); color: #8273e8; }

.mode-icon svg { width: 19px; height: 19px; }

.mode-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.mode-copy strong { font-size: 12.5px; font-weight: 700; }

.mode-copy small {
  margin-top: 3px;
  font-size: 10.5px;
  color: #8f95a4;
  line-height: 1.35;
}

.mode-card.selected .mode-copy small { color: #8a7267; }

.radio-dot {
  flex: none;
  width: 13px;
  height: 13px;
  margin-left: auto;
  border: 1px solid #d8dbe3;
  border-radius: 50%;
  background: #fff;
  transition: border-color .18s ease, border-width .18s ease;
}

.mode-card.selected .radio-dot { border: 4px solid var(--orange); }

.mode-card:disabled { opacity: .55; cursor: not-allowed; }

.mode-card:disabled:hover { border-color: var(--line); }

.support-note {
  margin-top: 9px;
  font-size: 11px;
  line-height: 1.5;
  color: #8a6a3c;
}

.support-note.tip { color: var(--muted); }

/* ---------- difficulty ---------- */

.difficulty-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.difficulty-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 85px;
  padding: 10px 6px 8px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fff;
  transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
}

.difficulty-card:hover { border-color: #f5c3b1; }

.difficulty-card.selected {
  border-color: var(--orange);
  background: #fffaf7;
  box-shadow: 0 0 0 2px rgba(244, 123, 80, .06);
}

.equation-preview {
  font-size: 17px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.equation-preview i {
  padding: 0 2px;
  font-style: normal;
  color: var(--orange);
}

.difficulty-card strong {
  margin-top: 5px;
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-soft);
  text-align: center;
}

.difficulty-card.selected strong { color: var(--ink); }

/* ---------- quantity ---------- */

.quantity-group { margin-bottom: 18px; }

.quantity-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.quantity-option {
  height: 39px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  transition: border-color .18s ease, background-color .18s ease, color .18s ease;
}

.quantity-option small { font-size: 10px; font-weight: 500; color: #8e93a0; }

.quantity-option:hover { border-color: #f5c3b1; }

.quantity-option.selected {
  border-color: var(--orange);
  background: #fff8f4;
  color: var(--orange-dark);
}

.quantity-option.selected small { color: var(--orange-dark); }

/* ---------- primary button ---------- */

.primary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 47px;
  border: 0;
  border-radius: 10px;
  background: var(--orange);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 6px 13px rgba(244, 123, 80, .17);
  transition: background-color .18s ease, transform .12s ease, box-shadow .18s ease;
}

.primary-button:hover { background: var(--orange-dark); box-shadow: 0 8px 17px rgba(244, 123, 80, .2); }

.primary-button:active { transform: translateY(1px); }

.button-arrow { margin-left: 12px; font-size: 17px; font-weight: 400; }

/* ---------- practice ---------- */

.practice-panel { padding: 20px 28px 22px; }

.practice-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.text-button,
.quit-button {
  border: 0;
  background: none;
  padding: 6px 0;
  color: var(--muted);
  font-size: 12px;
  transition: color .18s ease;
}

.text-button:hover,
.quit-button:hover { color: var(--orange); }

.text-button span { margin-right: 3px; font-size: 16px; vertical-align: -1px; }

.quit-button { padding: 6px; font-size: 11px; color: #999eaa; }

.progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
  font-size: 11px;
  color: #8f95a3;
  font-variant-numeric: tabular-nums;
}

.progress-track {
  height: 5px;
  margin-top: 9px;
  border-radius: 99px;
  background: var(--line-soft);
  overflow: hidden;
}

.progress-track span {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--orange);
  transition: width .3s ease;
}

.question-area {
  padding: 32px 8px 20px;
  text-align: center;
}

.question-kicker { font-size: 11px; color: var(--muted-2); }

.question {
  margin: 11px 0 4px;
  font-size: 45px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
  line-height: 1.2;
}

.question span { padding: 0 5px; color: var(--orange); }

.feedback {
  min-height: 22px;
  font-size: 12px;
  color: #979dab;
}

.feedback.good { color: var(--green); }

.feedback.bad { color: var(--red); }

/* typing */

#answer-form {
  display: flex;
  max-width: 390px;
  margin: 18px auto 0;
}

#answer {
  flex: 1;
  min-width: 0;
  height: 47px;
  padding: 0 14px;
  border: 1px solid #e6e8ef;
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  font-size: 17px;
  font-weight: 600;
  text-align: center;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}

#answer::placeholder { font-size: 12px; font-weight: 400; color: #b4b8c2; }

#answer:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(244, 123, 80, .09);
}

.submit-button {
  flex: none;
  margin-left: 8px;
  height: 47px;
  padding: 0 17px;
  border: 0;
  border-radius: 10px;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  transition: background-color .18s ease;
}

.submit-button:hover { background: #39435c; }

.submit-button span { padding-left: 5px; }

/* voice */

.voice-area { margin-top: 18px; }

.voice-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 0 22px;
  border: 0;
  border-radius: 12px;
  background: var(--lavender);
  color: var(--lavender-ink);
  font-size: 13px;
  font-weight: 700;
  transition: background-color .2s ease, color .2s ease;
}

.voice-button .voice-icon { display: grid; place-items: center; margin-right: 9px; }

.voice-button svg { width: 17px; height: 17px; }

.voice-button.is-listening {
  background: var(--orange-wash);
  color: var(--orange-dark);
  animation: breathe 2.2s ease-in-out infinite;
}

.voice-button.is-thinking { background: #fdf1ea; color: var(--orange-dark); }

.voice-button.is-paused { background: #f2f2f5; color: #8b8f9c; }

.voice-button.is-blocked { background: #fdeee9; color: #c2452a; }

.heard-text {
  min-height: 20px;
  margin-top: 9px;
  font-size: 15px;
  font-weight: 700;
  color: var(--orange-dark);
}

.voice-hint {
  min-height: 17px;
  font-size: 11px;
  color: var(--muted-2);
}

.voice-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 10px;
}

.voice-actions .mini-button { margin: 4px; }

.mini-button {
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 600;
}

.mini-button:hover { border-color: var(--orange); color: var(--orange-dark); }

.voice-switch {
  display: block;
  margin: 10px auto 0;
  padding: 4px 6px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11.5px;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: #d9dce4;
}

.voice-switch:hover { color: var(--ink-soft); }

/* ---------- results ---------- */

.results-panel {
  padding: 34px 30px 22px;
  text-align: center;
}

.result-icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  margin: 0 auto 13px;
  border-radius: 15px;
  background: var(--orange-wash);
  color: var(--orange);
  font-size: 23px;
}

.results-panel h2 {
  margin: 9px 0;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.results-panel > p { font-size: 12px; color: var(--muted); }

.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin: 24px 0 14px;
  padding: 17px 0;
  border-radius: 12px;
  background: #f8f8fb;
}

.result-stats div {
  display: flex;
  flex-direction: column;
  border-right: 1px solid #e9eaf0;
}

.result-stats div:last-child { border: 0; }

.result-stats strong {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.result-stats span { margin-top: 5px; font-size: 10px; color: #969ba8; }

.result-meta {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.mistakes li + li { margin-top: 6px; }

.mistakes {
  display: flex;
  flex-direction: column;
  max-height: 30vh;
  margin: 16px 0 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: #f8f8fb;
  list-style: none;
  overflow-y: auto;
  text-align: left;
}

.mistakes li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.mistakes .mine { margin-left: 12px; color: var(--red); }

.results-panel .primary-button { margin-top: 20px; }

.settings-link {
  display: block;
  margin: 10px auto 0;
  font-size: 12px;
}

/* ---------- focus / motion ---------- */

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}

.mode-card:focus-visible,
.difficulty-card:focus-visible,
.quantity-option:focus-visible { outline-offset: 1px; }

@keyframes breathe {
  50% { box-shadow: 0 0 0 8px rgba(244, 123, 80, .1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.shake { animation: shake .3s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ---------- narrow screens ---------- */

@media (max-width: 560px) {
  .app-shell {
    width: calc(100% - 28px);
    width: min(100% - 28px, 680px);
    padding-top: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }

  .topbar { padding-bottom: 14px; }

  .setup-panel { padding: 20px 16px 16px; }

  .mode-grid { grid-template-columns: 1fr; }

  .mode-card { height: 64px; }

  .difficulty-grid { gap: 6px; }

  .difficulty-card { height: 79px; }

  .equation-preview { font-size: 15px; }

  .difficulty-card strong { font-size: 9.5px; }

  .quantity-options { gap: 6px; }

  .practice-panel { padding: 16px 16px 18px; }

  .question-area { padding: 26px 2px 16px; }

  .question { font-size: 38px; }

  .submit-button { margin-left: 6px; }

  .submit-button { padding: 0 12px; }

  .results-panel { padding: 28px 18px 18px; }
}

@media (max-height: 680px) {
  .question-area { padding-top: 20px; }
  .question { font-size: 34px; }
  .result-stats { margin: 18px 0 12px; }
}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="速算练习">
        <span class="brand-mark" aria-hidden="true">＋</span>
        <span>速算练习</span>
      </a>
    </header>

    <section id="setup" class="panel setup-panel" aria-label="练习设置">
      <fieldset class="setting-group">
        <legend>练习方式</legend>
        <div class="mode-grid">
          <button class="mode-card selected" type="button" data-mode="type" aria-pressed="true">
            <span class="mode-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M6.5 13.5h.01M17 13.5h.01M9.5 13.5h5"/></svg>
            </span>
            <span class="mode-copy"><strong>打字作答</strong><small>看题后用数字键输入</small></span>
            <span class="radio-dot" aria-hidden="true"></span>
          </button>
          <button class="mode-card" type="button" data-mode="voice" aria-pressed="false">
            <span class="mode-icon voice-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3"/></svg>
            </span>
            <span class="mode-copy"><strong>语音作答</strong><small>看题后直接说出答案</small></span>
            <span class="radio-dot" aria-hidden="true"></span>
          </button>
        </div>
        <p class="support-note" id="voice-note" hidden>这个浏览器不支持语音识别，先用打字作答也可以。</p>
        <p class="support-note tip" id="voice-tip" hidden>开始后请允许麦克风，说完答案会自动进入下一题。</p>
      </fieldset>

      <fieldset class="setting-group">
        <legend>题目难度</legend>
        <div class="difficulty-grid">
          <button class="difficulty-card selected" type="button" data-level="two" aria-pressed="true">
            <span class="equation-preview">47 <i>+</i> 36</span>
            <strong>两位数 ± 两位数</strong>
          </button>
          <button class="difficulty-card" type="button" data-level="mixed" aria-pressed="false">
            <span class="equation-preview">385 <i>−</i> 27</span>
            <strong>两位数 ± 三位数</strong>
          </button>
          <button class="difficulty-card" type="button" data-level="three" aria-pressed="false">
            <span class="equation-preview">648 <i>+</i> 293</span>
            <strong>三位数 ± 三位数</strong>
          </button>
        </div>
      </fieldset>

      <fieldset class="setting-group quantity-group">
        <legend>题目数量</legend>
        <div class="quantity-options" role="group" aria-label="题目数量">
          <button class="quantity-option selected" type="button" data-count="10" aria-pressed="true">10 <small>题</small></button>
          <button class="quantity-option" type="button" data-count="20" aria-pressed="false">20 <small>题</small></button>
          <button class="quantity-option" type="button" data-count="30" aria-pressed="false">30 <small>题</small></button>
          <button class="quantity-option" type="button" data-count="0" aria-pressed="false">不限</button>
        </div>
      </fieldset>

      <button id="start-button" class="primary-button" type="button">
        <span>开始练习</span><span class="button-arrow" aria-hidden="true">→</span>
      </button>
    </section>

    <section id="practice" class="panel practice-panel" aria-label="口算练习" hidden>
      <div class="practice-topline">
        <button id="back-button" class="text-button" type="button"><span aria-hidden="true">←</span> 练习设置</button>
        <button id="quit-button" class="quit-button" type="button">结束练习</button>
      </div>
      <div class="progress-row">
        <span id="progress-label">第 1 题</span>
        <span id="score-label">答对 0 题</span>
      </div>
      <div class="progress-track"><span id="progress-fill"></span></div>

      <div class="question-area">
        <span class="question-kicker">请计算</span>
        <div id="question" class="question" aria-live="polite">47 <span>+</span> 36 <span>=</span> ?</div>
        <div id="feedback" class="feedback" role="status" aria-live="polite">仔细想一想，输入你的答案</div>

        <form id="answer-form" autocomplete="off" novalidate>
          <label class="sr-only" for="answer">输入答案</label>
          <input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="输入答案" autocomplete="off" enterkeyhint="done">
          <button class="submit-button" type="submit">确认答案 <span aria-hidden="true">↗</span></button>
        </form>

        <div id="voice-area" class="voice-area" hidden>
          <button id="voice-button" class="voice-button" type="button" aria-pressed="false">
            <span class="voice-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3"/></svg>
            </span>
            <span id="voice-label">正在聆听…</span>
          </button>
          <p id="heard-text" class="heard-text" aria-live="polite"></p>
          <p id="voice-hint" class="voice-hint">说完答案会自动进入下一题，点麦克风可暂停</p>
          <div id="voice-actions" class="voice-actions" hidden>
            <button id="voice-retry" class="mini-button" type="button">重新打开麦克风</button>
            <button id="new-tab" class="mini-button" type="button" hidden>在新窗口打开</button>
          </div>
          <button id="switch-mode" class="voice-switch" type="button">改用打字作答</button>
        </div>
      </div>
    </section>

    <section id="results" class="panel results-panel" aria-label="练习结果" hidden>
      <div class="result-icon" aria-hidden="true">✦</div>
      <h2>练习完成！</h2>
      <p id="result-message">太棒了，今天又进步了一点。</p>
      <div class="result-stats">
        <div><strong id="result-correct">0</strong><span>答对题数</span></div>
        <div><strong id="result-total">0</strong><span>完成题数</span></div>
        <div><strong id="result-accuracy">0%</strong><span>正确率</span></div>
      </div>
      <p class="result-meta">用时 <span id="result-time">0 秒</span> · 平均每题 <span id="result-avg">0 秒</span></p>
      <ul id="mistakes" class="mistakes" hidden></ul>
      <button id="again-button" class="primary-button" type="button">
        <span>再练一组</span><span class="button-arrow" aria-hidden="true">→</span>
      </button>
      <button id="settings-button" class="text-button settings-link" type="button">返回设置</button>
    </section>
  </main>

  <script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------ *
   * 版本自检
   * 发布刚完成时，浏览器可能拿到「新页面 + 旧脚本」的组合：旧脚本按旧结构
   * 取元素会直接报错，表现为所有按钮都点不动。这里先确认结构对得上，
   * 对不上就带参数重新取一次页面。
   * ------------------------------------------------------------------ */

  const REQUIRED_IDS = ['setup', 'practice', 'results', 'answer-form', 'question', 'voice-button'];
  const domMatches = REQUIRED_IDS.every((id) => document.getElementById(id));
  if (!domMatches) {
    if (location.search.indexOf('fresh=') === -1) {
      const base = location.href.split('#')[0];
      const joiner = base.indexOf('?') === -1 ? '?' : '&';
      location.replace(`${base}${joiner}fresh=${Date.now().toString(36)}`);
      return;
    }
    document.body.insertAdjacentHTML(
      'afterbegin',
      '<div style="margin:0;padding:14px 18px;background:#fff0e9;color:#a03c1c;font:14px/1.6 -apple-system,sans-serif">'
      + '页面缓存还是旧版本。<a href="' + location.pathname + '?reload=' + Date.now() + '" '
      + 'style="color:#a03c1c;font-weight:700">点这里重新加载</a> 即可。'
      + '</div>'
    );
    return;
  }

  const STORE_KEY = 'kousuan:v1';
  const MINUS = '−';
  const LEVEL_LABELS = { two: '两位数 ± 两位数', mixed: '两位数 ± 三位数', three: '三位数 ± 三位数' };

  const el = (id) => document.getElementById(id);

  /* 旧版 Safari 的 classList.toggle 不支持第二个参数，这里显式区分 */
  function setClass(node, name, on) {
    if (on) node.classList.add(name);
    else node.classList.remove(name);
  }

  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supportsSpeech = Boolean(Recognition);
  const inFrame = window.self !== window.top;
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  const defaults = { mode: 'type', level: 'two', count: 10 };
  let prefs = { ...defaults };
  let best = {};

  let view = 'setup';
  let session = null;
  let locked = false;
  let advanceTimer = 0;
  let awayMs = 0;
  let awaySince = 0;

  /* ------------------------------------------------------------------ *
   * 本地设置
   * ------------------------------------------------------------------ */

  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.prefs) prefs = Object.assign({}, defaults, data.prefs);
      if (data && data.best) best = data.best;
    }
  } catch (_) {
    /* 无痕模式或数据损坏：用默认值 */
  }

  if (['type', 'voice'].indexOf(prefs.mode) === -1) prefs.mode = defaults.mode;
  if (['two', 'mixed', 'three'].indexOf(prefs.level) === -1) prefs.level = defaults.level;
  if ([0, 10, 20, 30].indexOf(prefs.count) === -1) prefs.count = defaults.count;
  if (!supportsSpeech) prefs.mode = 'type';

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ prefs, best }));
    } catch (_) {
      /* 存不下也不影响练习 */
    }
  }

  /* ------------------------------------------------------------------ *
   * 设置页
   * ------------------------------------------------------------------ */

  function syncSetup() {
    document.querySelectorAll('[data-mode]').forEach((button) => {
      const on = button.dataset.mode === prefs.mode;
      setClass(button, 'selected', on);
      button.setAttribute('aria-pressed', String(on));
    });
    document.querySelectorAll('[data-level]').forEach((button) => {
      const on = button.dataset.level === prefs.level;
      setClass(button, 'selected', on);
      button.setAttribute('aria-pressed', String(on));
    });
    document.querySelectorAll('[data-count]').forEach((button) => {
      const on = Number(button.dataset.count) === prefs.count;
      setClass(button, 'selected', on);
      button.setAttribute('aria-pressed', String(on));
    });
    el('voice-tip').hidden = !(prefs.mode === 'voice' && supportsSpeech);
  }

  document.querySelectorAll('[data-mode]').forEach((button) => {
    button.addEventListener('click', () => {
      if (button.disabled) return;
      prefs.mode = button.dataset.mode;
      syncSetup();
      persist();
    });
  });

  document.querySelectorAll('[data-level]').forEach((button) => {
    button.addEventListener('click', () => {
      prefs.level = button.dataset.level;
      syncSetup();
      persist();
    });
  });

  document.querySelectorAll('[data-count]').forEach((button) => {
    button.addEventListener('click', () => {
      prefs.count = Number(button.dataset.count);
      syncSetup();
      persist();
    });
  });

  if (!supportsSpeech) {
    const voiceCard = document.querySelector('[data-mode="voice"]');
    if (voiceCard) {
      voiceCard.disabled = true;
      voiceCard.setAttribute('aria-describedby', 'voice-note');
      voiceCard.querySelector('.mode-copy small').textContent = '此浏览器不支持';
    }
    el('voice-note').hidden = false;
  }

  el('start-button').addEventListener('click', startSession);
  el('again-button').addEventListener('click', startSession);

  el('settings-button').addEventListener('click', () => {
    syncSetup();
    showView('setup');
  });

  el('back-button').addEventListener('click', () => {
    stopVoice();
    clearTimeout(advanceTimer);
    session = null;
    locked = false;
    showView('setup');
  });

  el('quit-button').addEventListener('click', finishSession);

  /* ------------------------------------------------------------------ *
   * 出题
   * ------------------------------------------------------------------ */

  const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  function draftQuestion() {
    const twoDigit = () => randomInt(10, 99);
    const threeDigit = () => randomInt(100, 999);
    let a;
    let b;

    if (prefs.level === 'three') {
      a = threeDigit();
      b = threeDigit();
    } else if (prefs.level === 'mixed') {
      if (Math.random() < 0.5) {
        a = threeDigit();
        b = twoDigit();
      } else {
        a = twoDigit();
        b = threeDigit();
      }
    } else {
      a = twoDigit();
      b = twoDigit();
    }

    const op = Math.random() < 0.5 ? '+' : MINUS;
    if (op === MINUS && b > a) [a, b] = [b, a];

    return { a, b, op, answer: op === '+' ? a + b : a - b };
  }

  /* 40 + 60、300 - 300 这类题目没有练习价值 */
  function isBoring({ a, b, op, answer }) {
    if (a % 10 === 0 && b % 10 === 0) return true;
    return op === MINUS && answer === 0;
  }

  function buildQuestion() {
    for (let i = 0; i < 8; i += 1) {
      const question = draftQuestion();
      if (!isBoring(question)) return question;
    }
    return draftQuestion();
  }

  function freshQuestion() {
    for (let attempt = 0; attempt < 12; attempt += 1) {
      const question = buildQuestion();
      const key = `${question.a}${question.op}${question.b}`;
      if (!session.seen.has(key)) {
        session.seen.add(key);
        return question;
      }
    }
    return buildQuestion();
  }

  /* ------------------------------------------------------------------ *
   * 练习流程
   * ------------------------------------------------------------------ */

  function startSession() {
    clearTimeout(advanceTimer);
    locked = false;
    awayMs = 0;
    awaySince = document.hidden ? performance.now() : 0;
    session = {
      index: 0,
      answered: 0,
      correct: 0,
      mistakes: [],
      seen: new Set(),
      current: null,
      startedAt: performance.now(),
    };

    showView('practice');
    applyModeLayout();
    nextQuestion();

    if (prefs.mode === 'voice' && supportsSpeech) startVoice();
  }

  function applyModeLayout() {
    const isVoice = prefs.mode === 'voice';
    el('answer-form').hidden = isVoice;
    el('voice-area').hidden = !isVoice;
    el('practice').dataset.mode = prefs.mode;
  }

  function nextQuestion() {
    if (!session) return;
    if (prefs.count > 0 && session.index >= prefs.count) {
      finishSession();
      return;
    }

    locked = false;
    session.index += 1;
    session.current = freshQuestion();

    renderQuestion();
    el('answer').value = '';
    setFeedback(prefs.mode === 'voice' ? '看着题目，直接说出答案' : '仔细想一想，输入你的答案');
    el('question').classList.remove('shake');
    updateMeta();

    if (prefs.mode === 'voice') {
      resumeVoice();
    } else if (finePointer) {
      el('answer').focus();
    }
  }

  function renderQuestion() {
    const question = session.current;
    el(
      'question'
    ).innerHTML = `${question.a} <span>${question.op}</span> ${question.b} <span>=</span> ?`;
  }

  function updateMeta() {
    const total = prefs.count;
    const done = session.answered;
    el('progress-label').textContent = total > 0
      ? `第 ${session.index} / ${total} 题`
      : `第 ${session.index} 题`;
    el('score-label').textContent = `答对 ${session.correct} 题`;
    el('progress-fill').style.width = total > 0 ? `${Math.min(done / total, 1) * 100}%` : '0%';
    el('progress-fill').parentElement.hidden = total === 0;
  }

  function submit(value) {
    if (locked || view !== 'practice' || !session) return false;
    if (!Number.isFinite(value)) {
      nudge('先输入答案');
      return false;
    }

    const question = session.current;
    const correct = value === question.answer;

    locked = true;
    session.answered += 1;
    if (correct) {
      session.correct += 1;
    } else {
      session.mistakes.push(Object.assign({}, question, { given: value }));
    }

    if (prefs.mode === 'voice') pauseVoice();

    setFeedback(correct ? '答对了' : `正确答案是 ${question.answer}`, correct ? 'good' : 'bad');
    el('answer').value = '';
    updateMeta();

    advanceTimer = setTimeout(nextQuestion, correct ? 650 : 1700);
    return true;
  }

  function submitTyped() {
    if (view !== 'practice') return;
    if (locked) {
      /* 反馈还没结束就再点确认：当作「下一题」 */
      advanceNow();
      return;
    }
    const raw = el('answer').value.trim();
    if (!raw) {
      nudge('先输入答案');
      return;
    }
    const digits = raw.replace(/[^\d-]/g, '');
    if (!digits || !/\d/.test(digits)) {
      nudge('请输入数字');
      return;
    }
    const value = Number(digits);
    if (!Number.isFinite(value)) {
      nudge('请输入数字');
      return;
    }
    submit(value);
  }

  function nudge(message) {
    setFeedback(message, 'bad');
    const question = el('question');
    question.classList.remove('shake');
    void question.offsetWidth;
    question.classList.add('shake');
    if (prefs.mode === 'type' && finePointer) el('answer').focus();
  }

  function setFeedback(text, kind = '') {
    const node = el('feedback');
    node.textContent = text;
    node.className = `feedback ${kind}`.trim();
  }

  el('answer-form').addEventListener('submit', (event) => {
    event.preventDefault();
    submitTyped();
  });

  document.addEventListener('keydown', (event) => {
    if (view !== 'practice') return;
    if (event.key === 'Enter' && locked) {
      event.preventDefault();
      advanceNow();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      finishSession();
    }
  });

  function advanceNow() {
    if (!locked) return;
    clearTimeout(advanceTimer);
    nextQuestion();
  }

  function finishSession() {
    clearTimeout(advanceTimer);
    stopVoice();
    if (!session) {
      showView('setup');
      return;
    }
    if (session.answered === 0) {
      session = null;
      showView('setup');
      return;
    }

    const accuracy = Math.round((session.correct / session.answered) * 100);
    const now = performance.now();
    const away = awayMs + (awaySince ? now - awaySince : 0);
    const seconds = Math.max(1, Math.round((now - session.startedAt - away) / 1000));

    const previous = best[prefs.level];
    const isRecord = !previous || accuracy > previous.accuracy;
    if (isRecord) {
      best[prefs.level] = { accuracy, seconds };
      persist();
    }

    el('result-correct').textContent = String(session.correct);
    el('result-total').textContent = String(session.answered);
    el('result-accuracy').textContent = `${accuracy}%`;
    el('result-time').textContent = formatDuration(seconds);
    el('result-avg').textContent = `${(seconds / session.answered).toFixed(1)} 秒`;
    el('result-message').textContent = messageFor(accuracy, isRecord, previous);

    const list = el('mistakes');
    list.innerHTML = '';
    if (session.mistakes.length) {
      session.mistakes.forEach((item) => {
        const li = document.createElement('li');
        const equation = document.createElement('span');
        equation.textContent = `${item.a} ${item.op} ${item.b} = ${item.answer}`;
        const mine = document.createElement('span');
        mine.className = 'mine';
        mine.textContent = `你答 ${item.given}`;
        li.appendChild(equation);
        li.appendChild(mine);
        list.appendChild(li);
      });
      list.hidden = false;
    } else {
      list.hidden = true;
    }

    session = null;
    showView('results');
  }

  function messageFor(accuracy, isRecord, previous) {
    if (accuracy === 100) return '全部正确，这一组非常稳。';
    if (isRecord) {
      return previous
        ? `刷新最好成绩，之前是 ${previous.accuracy}%。`
        : '已记下这组成绩，下次可以对比。';
    }
    return `最好成绩 ${previous.accuracy}%，再来一组试试。`;
  }

  function formatDuration(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    if (minutes === 0) return `${seconds} 秒`;
    return `${minutes} 分 ${(seconds < 10 ? '0' : '') + seconds} 秒`;
  }

  function showView(next) {
    view = next;
    el('setup').hidden = next !== 'setup';
    el('practice').hidden = next !== 'practice';
    el('results').hidden = next !== 'results';
    window.scrollTo(0, 0);
  }

  /* ------------------------------------------------------------------ *
   * 语音识别
   * ------------------------------------------------------------------ */

  const CN_DIGITS = {
    '零': 0, '〇': 0, '一': 1, '壹': 1, '幺': 1, '二': 2, '贰': 2, '两': 2, '俩': 2,
    '三': 3, '叁': 3, '四': 4, '肆': 4, '五': 5, '伍': 5, '六': 6, '陆': 6,
    '七': 7, '柒': 7, '八': 8, '捌': 8, '九': 9, '玖': 9,
  };
  const CN_UNITS = { '十': 10, '拾': 10, '百': 100, '佰': 100, '千': 1000, '仟': 1000 };

  /* 识别引擎常把数字听成同音字，例如「四」->「是」「寺」 */
  const HOMOPHONES = {
    '是': 4, '事': 4, '市': 4, '式': 4, '试': 4, '氏': 4, '似': 4, '寺': 4, '视': 4,
    '示': 4, '世': 4, '室': 4, '适': 4, '释': 4, '势': 4, '伺': 4, '嗣': 4,
    '依': 1, '衣': 1, '医': 1, '仪': 1, '移': 1, '伊': 1, '以': 1, '已': 1,
    '而': 2, '儿': 2, '耳': 2, '尔': 2,
    '山': 3, '伞': 3, '衫': 3, '善': 3, '散': 3,
    '无': 5, '午': 5, '舞': 5, '武': 5, '物': 5, '务': 5, '误': 5, '雾': 5,
    '溜': 6, '流': 6, '留': 6, '柳': 6, '绿': 6, '录': 6,
    '齐': 7, '奇': 7, '妻': 7, '期': 7, '欺': 7,
    '巴': 8, '拔': 8, '爸': 8, '罢': 8, '疤': 8,
    '酒': 9, '久': 9, '旧': 9, '救': 9, '揪': 9,
    '灵': 0, '铃': 0, '龄': 0, '另': 0, '领': 0,
    '时': 10, '实': 10, '识': 10, '食': 10, '石': 10,
    '白': 100, '摆': 100, '败': 100,
    '千': 1000, '签': 1000, '前': 1000, '钱': 1000,
  };

  const NOISE = /[嗯啊哦呃喔诶欸唔呀哈唉哎噢哟哪]/g;
  const FILLER_PHRASES = [
    '答案是', '答案', '等于', '应该是', '大概是', '我觉得', '我认为', '我算',
    '结果', '就是', '那个', '这个', '大概', '可能', '我猜', '数字',
  ];

  const DIGIT_CHARS = Object.keys(CN_DIGITS).join('');
  const UNIT_CHARS = Object.keys(CN_UNITS).join('');
  const SPOKEN_RUN = new RegExp(
    `[${DIGIT_CHARS}]+[${UNIT_CHARS}][${DIGIT_CHARS}${UNIT_CHARS}]*`
    + `|[${UNIT_CHARS}][${DIGIT_CHARS}${UNIT_CHARS}]*`
    + `|[${DIGIT_CHARS}]+`,
    'g'
  );

  function normalizeSpeech(text) {
    return String(text || '')
      .replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
      .replace(/[，,。.、！!？?：:；;“”"'‘’（）()《》\s]/g, '')
      .replace(/[负]/g, '-');
  }

  function evaluateChineseNumber(run) {
    if (!run) return null;
    const hasUnit = /[十拾百佰千仟]/.test(run);
    if (!hasUnit) {
      if (run.length === 1) {
        const digit = CN_DIGITS[run];
        return digit === undefined ? null : digit;
      }
      let value = 0;
      for (const ch of run) {
        const digit = CN_DIGITS[ch];
        if (digit === undefined) return null;
        value = value * 10 + digit;
      }
      return value;
    }

    let total = 0;
    let current = null;
    for (const ch of run) {
      const digit = CN_DIGITS[ch];
      if (digit !== undefined) {
        current = digit;
        continue;
      }
      const unit = CN_UNITS[ch];
      if (!unit) return null;
      if (current === null) current = 1;
      total += current * unit;
      current = 0;
    }

    /* 口语省字：「两百五」是 250、「一千二」是 1200；带「零」或「十」时按字面算 */
    const trailingDigit = current !== null && current > 0;
    if (trailingDigit && !/[零〇十拾]/.test(run)) {
      if (/[百佰]/.test(run)) return total + current * 10;
      if (/[千仟]/.test(run)) return total + current * 100;
    }

    return total + (current || 0);
  }

  function parseStrict(text) {
    if (!text) return null;

    const arabic = text.match(/\d+/g);
    if (arabic) {
      const longest = arabic.reduce((a, b) => (b.length > a.length ? b : a));
      const value = Number(longest);
      return Number.isFinite(value) ? value : null;
    }

    const runs = text.match(SPOKEN_RUN);
    if (!runs) return null;

    runs.sort((a, b) => {
      const unitA = /[十拾百佰千仟]/.test(a) ? 1 : 0;
      const unitB = /[十拾百佰千仟]/.test(b) ? 1 : 0;
      if (unitA !== unitB) return unitB - unitA;
      return b.length - a.length;
    });

    for (const run of runs) {
      const value = evaluateChineseNumber(run);
      if (value !== null) return value;
    }
    return null;
  }

  function stripFillers(text) {
    let out = text.replace(NOISE, '');
    FILLER_PHRASES.forEach((phrase) => {
      out = out.split(phrase).join('');
    });
    return out;
  }

  /* 只在整个短句都能映射成数字时才使用同音字，避免把正常词句误判成数字 */
  function mapHomophones(text) {
    let out = '';
    for (const ch of text) {
      if (CN_DIGITS[ch] !== undefined || CN_UNITS[ch] !== undefined) {
        out += ch;
        continue;
      }
      const homophone = HOMOPHONES[ch];
      if (homophone === undefined) return null;
      out += homophone;
    }
    return out;
  }

  function parseSpokenNumber(text) {
    const normalized = normalizeSpeech(text);
    if (!normalized) return null;

    const strict = parseStrict(normalized);
    if (strict !== null) return strict;

    const trimmed = stripFillers(normalized);
    if (trimmed && trimmed !== normalized) {
      const cleaned = parseStrict(trimmed);
      if (cleaned !== null) return cleaned;
    }

    const mapped = mapHomophones(trimmed || '');
    if (mapped) {
      const value = parseStrict(mapped);
      if (value !== null && value <= 9999) return value;
    }
    return null;
  }

  let recognition = null;
  let wantListen = false;
  let isListening = false;
  let paused = false;
  let restartTimer = 0;
  let micProblem = null;
  let hasStarted = false;
  let silenceCount = 0;

  function createRecognition() {
    const instance = new Recognition();
    instance.lang = 'zh-CN';
    instance.continuous = false;
    instance.interimResults = true;
    instance.maxAlternatives = 5;

    instance.onstart = () => {
      isListening = true;
      hasStarted = true;
      micProblem = null;
      setVoiceState('listening');
      if (!locked) setVoiceLabel('正在聆听…');
    };

    instance.onresult = (event) => {
      if (locked) return;
      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        const result = event.results[i];
        const text = (result[0].transcript || '').trim();
        if (!text) continue;
        silenceCount = 0;
        el('heard-text').textContent = text;
        if (!result.isFinal) continue;

        let value = null;
        for (let k = 0; k < result.length; k += 1) {
          const candidate = parseSpokenNumber(result[k].transcript);
          if (candidate !== null) {
            value = candidate;
            break;
          }
        }
        if (value === null) value = parseSpokenNumber(text);

        if (value === null) {
          setFeedback('没听清，再说一次', 'bad');
          continue;
        }
        setFeedback('');
        submit(value);
        break;
      }
    };

    instance.onerror = (event) => {
      const code = event && event.error;
      if (code === 'no-speech') {
        silenceCount += 1;
        if (silenceCount >= 3) {
          pausePrompt('没听到声音，点麦克风继续', '继续收音');
        } else {
          setFeedback('没听到声音，再说一次', 'bad');
        }
        return;
      }
      if (code === 'aborted') return;
      if (code === 'not-allowed' || code === 'service-not-allowed') {
        failVoice('麦克风没有打开。允许权限后重试，或改用打字作答。');
        return;
      }
      if (code === 'audio-capture') {
        failVoice('没有找到可用的麦克风。');
        return;
      }
      if (code === 'network') {
        failVoice(inFrame ? '预览窗口里语音服务连不上，可以点「在新窗口打开」再试。' : '语音服务暂时连不上，请稍后再试。');
        return;
      }
      failVoice('语音识别出了点问题，可以重试或改用打字作答。');
    };

    instance.onend = () => {
      isListening = false;
      if (wantListen && !paused && view === 'practice' && !micProblem) {
        scheduleRestart(200);
      } else if (!micProblem) {
        setVoiceState(wantListen ? 'paused' : 'idle');
      }
    };

    return instance;
  }

  function listen() {
    if (!wantListen || paused || locked || view !== 'practice') return;
    if (!recognition) recognition = createRecognition();
    clearTimeout(restartTimer);
    try {
      recognition.start();
    } catch (error) {
      if (error && error.name === 'InvalidStateError') {
        scheduleRestart(320);
        return;
      }
      if (error && (error.name === 'NotAllowedError' || error.name === 'SecurityError') && hasStarted) {
        pausePrompt('浏览器需要你点一下才能继续收音', '继续收音');
        return;
      }
      failVoice('麦克风没有打开。允许权限后重试，或改用打字作答。');
    }
  }

  function scheduleRestart(delay) {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      if (wantListen && !paused && !locked && view === 'practice' && !micProblem) listen();
    }, delay);
  }

  function startVoice() {
    if (!Recognition) return;
    wantListen = true;
    paused = false;
    micProblem = null;
    silenceCount = 0;
    hasStarted = false;
    el('heard-text').textContent = '';
    el('voice-actions').hidden = true;
    el('new-tab').hidden = !inFrame;
    el('voice-hint').textContent = '说完答案会自动进入下一题，点麦克风可暂停';
    el('feedback').className = 'feedback';
    setFeedback('看着题目，直接说出答案');
    setVoiceState('listening');
    listen();
  }

  function pauseVoice() {
    paused = true;
    clearTimeout(restartTimer);
    if (recognition && isListening) {
      try {
        recognition.stop();
      } catch (_) {
        /* 已经停止 */
      }
    }
    setVoiceState(wantListen ? 'thinking' : 'idle');
  }

  function resumeVoice() {
    if (!Recognition || !wantListen || micProblem) return;
    paused = false;
    el('heard-text').textContent = '';
    listen();
  }

  function stopVoice() {
    wantListen = false;
    paused = true;
    micProblem = null;
    clearTimeout(restartTimer);
    if (recognition) {
      try {
        recognition.abort();
      } catch (_) {
        /* 已经停止 */
      }
    }
    isListening = false;
    setVoiceState('idle');
  }

  function pausePrompt(message, label) {
    wantListen = true;
    paused = true;
    micProblem = 'prompt';
    clearTimeout(restartTimer);
    if (recognition && isListening) {
      try {
        recognition.abort();
      } catch (_) {
        /* 已经停止 */
      }
    }
    isListening = false;
    setVoiceState('paused');
    setVoiceLabel('点一下继续');
    el('voice-hint').textContent = message;
    el('voice-retry').textContent = label;
    el('voice-actions').hidden = false;
    el('new-tab').hidden = !inFrame;
  }

  function failVoice(message) {
    wantListen = false;
    paused = true;
    micProblem = 'failed';
    clearTimeout(restartTimer);
    if (recognition) {
      try {
        recognition.abort();
      } catch (_) {
        /* 已经停止 */
      }
    }
    isListening = false;
    setVoiceState('blocked');
    setVoiceLabel('麦克风未开启');
    el('voice-hint').textContent = message;
    el('voice-retry').textContent = '重新打开麦克风';
    el('voice-actions').hidden = false;
    el('new-tab').hidden = !inFrame;
  }

  const VOICE_LABELS = {
    listening: '正在聆听…',
    thinking: '已听到',
    paused: '点一下继续',
    idle: '开始聆听',
    blocked: '麦克风未开启',
  };

  function setVoiceState(state) {
    const button = el('voice-button');
    setClass(button, 'is-listening', state === 'listening');
    setClass(button, 'is-thinking', state === 'thinking');
    setClass(button, 'is-paused', state === 'paused');
    setClass(button, 'is-blocked', state === 'blocked');
    button.setAttribute('aria-pressed', String(state === 'listening'));
    setVoiceLabel(VOICE_LABELS[state] || VOICE_LABELS.idle);
  }

  function setVoiceLabel(text) {
    el('voice-label').textContent = text;
  }

  el('voice-button').addEventListener('click', () => {
    if (view !== 'practice' || prefs.mode !== 'voice' || locked) return;

    if (micProblem) {
      micProblem = null;
      silenceCount = 0;
      wantListen = true;
      paused = false;
      el('voice-actions').hidden = true;
      el('voice-hint').textContent = '说完答案会自动进入下一题，点麦克风可暂停';
      setVoiceState('listening');
      listen();
      return;
    }

    if (wantListen) {
      wantListen = false;
      pauseVoice();
      setVoiceState('paused');
      setVoiceLabel('已暂停');
      setFeedback('已暂停收音，点麦克风继续');
      el('voice-hint').textContent = '点麦克风继续收音';
    } else {
      startVoice();
      setFeedback('看着题目，直接说出答案');
    }
  });

  el('voice-retry').addEventListener('click', () => {
    micProblem = null;
    silenceCount = 0;
    wantListen = true;
    paused = false;
    el('voice-actions').hidden = true;
    el('voice-hint').textContent = '说完答案会自动进入下一题，点麦克风可暂停';
    setVoiceState('listening');
    listen();
  });

  el('new-tab').addEventListener('click', () => {
    const win = window.open(location.href, '_blank', 'noopener');
    if (!win) setFeedback('浏览器拦住了新窗口，请手动在新标签页打开本页。', 'bad');
  });

  el('switch-mode').addEventListener('click', () => {
    prefs.mode = 'type';
    persist();
    syncSetup();
    stopVoice();
    applyModeLayout();
    el('feedback').className = 'feedback';
    setFeedback('已改用打字作答', '');
    el('answer').focus();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (view === 'practice') awaySince = performance.now();
      if (isListening) {
        paused = true;
        try {
          recognition.stop();
        } catch (_) {
          /* 已经停止 */
        }
      }
      return;
    }

    if (awaySince) {
      awayMs += performance.now() - awaySince;
      awaySince = 0;
    }
    if (view === 'practice' && prefs.mode === 'voice' && wantListen && !locked && !micProblem) {
      paused = false;
      listen();
    }
  });

  window.addEventListener('beforeunload', () => {
    if (recognition) {
      try {
        recognition.abort();
      } catch (_) {
        /* 已经停止 */
      }
    }
  });

  /* ------------------------------------------------------------------ */

  syncSetup();
  window.kousuanReady = true;
})();
  </script>
  <script>
    (function () {
      var reported = false;

      function strip(text) {
        var box = document.createElement('div');
        box.style.cssText = 'margin:0 0 12px;padding:12px 16px;border-radius:10px;'
          + 'background:#fff0e9;color:#a03c1c;font:13px/1.55 -apple-system,BlinkMacSystemFont,'
          + '"PingFang SC",sans-serif';
        var msg = document.createElement('span');
        msg.textContent = text;
        box.appendChild(msg);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '重新加载';
        btn.style.cssText = 'display:block;margin-top:8px;padding:6px 14px;border:0;border-radius:7px;'
          + 'background:#f47b50;color:#fff;font:inherit;font-weight:700';
        btn.onclick = function () {
          var base = location.href.split('#')[0];
          var sep = base.indexOf('?') === -1 ? '?' : '&';
          location.href = base + sep + 'reload=' + new Date().getTime();
        };
        box.appendChild(btn);
        document.body.insertBefore(box, document.body.firstChild);
      }

      function report(text) {
        if (reported) return;
        reported = true;
        strip(text);
      }

      window.onerror = function (message, source, line) {
        report('页面出错了：' + message + '（第 ' + (line || '?') + ' 行）');
      };
      window.addEventListener('unhandledrejection', function (event) {
        report('页面出错了：' + (event && event.reason ? event.reason : '未知错误'));
      });

      function check() {
        if (window.kousuanReady) return;
        report('页面的脚本没有运行，所以按钮点了没有反应。可能是浏览器版本太旧'
          + '（建议 iOS / iPadOS 12 以上），也可能是页面没有下载完整。');
      }

      if (document.readyState === 'complete') setTimeout(check, 900);
      else window.addEventListener('load', function () { setTimeout(check, 900); });
    })();
  </script>
  <noscript>
    <p style="margin:0;padding:14px 18px;background:#fff0e9;color:#a03c1c;font:14px/1.6 sans-serif">
      需要开启 JavaScript 才能答题，请在浏览器设置里允许脚本后重新打开。
    </p>
  </noscript>
