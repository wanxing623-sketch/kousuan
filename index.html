<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="速算练习：打字或语音作答的口算练习，支持两位数与三位数加减。">
  <title>速算练习</title>
  <link rel="preload" href="fonts/NotoSansSC-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true">+</span>速算练习</span>
    </header>

    <section id="setup" class="panel" aria-labelledby="setup-title">
      <h1 id="setup-title" tabindex="-1">今天练几道？</h1>
      <p class="lead">选好方式和难度，马上开始。</p>

      <div class="group">
        <h2 class="group-title"><span class="group-num" aria-hidden="true">1</span>练习方式</h2>
        <div class="mode-grid">
          <button class="mode-card selected" type="button" data-mode="typing" aria-pressed="true">
            <span class="mode-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 13h6"/></svg>
            </span>
            <span class="mode-text"><strong>打字作答</strong><small>看题后输入答案</small></span>
            <span class="radio" aria-hidden="true"></span>
          </button>
          <button class="mode-card" type="button" data-mode="voice" aria-pressed="false">
            <span class="mode-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
            </span>
            <span class="mode-text"><strong>语音作答</strong><small>看题后说出答案</small></span>
            <span class="radio" aria-hidden="true"></span>
          </button>
        </div>
        <p id="voice-note" class="note" hidden></p>
      </div>

      <div class="group">
        <h2 class="group-title"><span class="group-num" aria-hidden="true">2</span>题目难度</h2>
        <div class="difficulty-grid">
          <button class="difficulty-card selected" type="button" data-level="two" aria-pressed="true">
            <span class="equation">47 <i>+</i> 36</span>
            <strong>两位数 ± 两位数</strong>
            <span class="tag">入门</span>
          </button>
          <button class="difficulty-card" type="button" data-level="mixed" aria-pressed="false">
            <span class="equation">385 <i>−</i> 27</span>
            <strong>两位数 ± 三位数</strong>
            <span class="tag">进阶</span>
          </button>
          <button class="difficulty-card" type="button" data-level="three" aria-pressed="false">
            <span class="equation">648 <i>+</i> 293</span>
            <strong>三位数 ± 三位数</strong>
            <span class="tag">挑战</span>
          </button>
        </div>
      </div>

      <div class="group">
        <h2 class="group-title"><span class="group-num" aria-hidden="true">3</span>题目数量</h2>
        <div class="quantity-grid">
          <button class="quantity-option selected" type="button" data-count="10" aria-pressed="true">10 题</button>
          <button class="quantity-option" type="button" data-count="20" aria-pressed="false">20 题</button>
          <button class="quantity-option" type="button" data-count="30" aria-pressed="false">30 题</button>
          <button class="quantity-option" type="button" data-count="0" aria-pressed="false">不限</button>
        </div>
      </div>

      <button id="start-button" class="primary-button" type="button">开始练习</button>
      <p class="fine-print">选好一次会记住，下次直接开始。</p>
    </section>

    <section id="practice" class="panel" aria-labelledby="practice-title" hidden>
      <h2 id="practice-title" class="sr-only" tabindex="-1">口算练习</h2>
      <div class="practice-top">
        <button id="quit-button" class="text-button" type="button">结束这组</button>
      </div>
      <div class="progress-row">
        <span id="progress-label">第 1 / 10 题</span>
        <span>用时 <span id="timer-label">00:00</span></span>
      </div>
      <div class="progress-track"><span id="progress-fill"></span></div>

      <div class="question-area">
        <div id="question" class="question" aria-live="polite">47 <span>+</span> 36 <span>=</span> ?</div>
        <p id="feedback" class="feedback" aria-live="polite">输入答案后按确认。</p>
      </div>

      <form id="answer-form" autocomplete="off">
        <label class="sr-only" for="answer">输入答案</label>
        <input id="answer" type="text" inputmode="numeric" enterkeyhint="done" placeholder="输入答案">
        <button class="primary-button submit-button" type="submit">确认</button>
      </form>

      <div id="voice-area" hidden>
        <button id="voice-button" class="voice-button" type="button">
          <span class="voice-dot" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
          <span id="voice-label">点按开始说话</span>
        </button>
        <p class="voice-hint">直接说出答案，例如“八十三”。</p>
        <p id="heard-text" class="heard-text" aria-live="polite"></p>
        <button id="voice-fallback" class="text-button fallback" type="button">识别不准？改用打字作答</button>
      </div>

      <button id="next-button" class="primary-button" type="button" hidden>下一题 →</button>
      <button id="skip-button" class="text-button skip" type="button">跳过这题</button>
    </section>

    <section id="results" class="panel" aria-labelledby="results-title" hidden>
      <h2 id="results-title" tabindex="-1">练习完成</h2>
      <p id="result-message" class="lead">多练几组，速度和准确率都会上去。</p>
      <div class="stats">
        <div class="stat"><strong id="result-correct">0</strong><span>答对</span></div>
        <div class="stat"><strong id="result-total">0</strong><span>总题数</span></div>
        <div class="stat"><strong id="result-accuracy">0%</strong><span>正确率</span></div>
        <div class="stat"><strong id="result-time">00:00</strong><span>总用时</span></div>
        <div class="stat"><strong id="result-avg">—</strong><span>平均每题</span></div>
        <div class="stat"><strong id="result-streak">0</strong><span>最高连对</span></div>
      </div>
      <p id="best-line" class="best-line" hidden></p>

      <div id="wrong-section" hidden>
        <h3 id="wrong-title">答错的题</h3>
        <ul id="wrong-list" class="wrong-list"></ul>
      </div>

      <button id="again-button" class="primary-button" type="button">再练一组</button>
      <button id="review-button" class="secondary-button" type="button" hidden>重练错题</button>
      <button id="settings-button" class="text-button settings-link" type="button">返回设置</button>
    </section>

    <footer class="footer">成绩只保存在本机</footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
