name: Snapshot reference site

on:
  push:
    branches:
      - arena/a55d433e-kousuan
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Screenshot reference (mobile)
        run: |
          mkdir -p .snapshot
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,844 --force-device-scale-factor=2 \
            --virtual-time-budget=8000 \
            --screenshot=.snapshot/ref-mobile.png \
            "https://01a1e914-01ee-7b69-8eb4-18988b026c39.arena.site/" || true
          curl -sSL "https://01a1e914-01ee-7b69-8eb4-18988b026c39.arena.site/?embed=true" -o .snapshot/ref-embed.html || true
          ls -la .snapshot
      - name: Screenshot reference (desktop)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1280,900 \
            --virtual-time-budget=8000 \
            --screenshot=.snapshot/ref-desktop.png \
            "https://01a1e914-01ee-7b69-8eb4-18988b026c39.arena.site/" || true
      - name: Commit snapshot back to branch
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot@example.com"
          git add -f .snapshot
          git commit -m "snapshot: reference site screenshots" || true
          git push origin HEAD:arena/a55d433e-kousuan || true
