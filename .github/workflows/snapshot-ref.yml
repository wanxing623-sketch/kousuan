name: Snapshot reference site

on:
  push:
    branches:
      - arena/a55d433e-kousuan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch reference html
        run: |
          mkdir -p ref
          curl -sSL "https://01a1e914-01ee-7b69-8eb4-18988b026c39.arena.site/" -o ref/ref.html || true
          wc -c ref/ref.html
      - name: Screenshot reference (mobile)
        run: |
          google-chrome --version
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,844 --force-device-scale-factor=2 \
            --virtual-time-budget=6000 \
            --screenshot=ref/ref-mobile.png \
            "https://01a1e914-01ee-7b69-8eb4-18988b026c39.arena.site/" || true
          ls -la ref
      - name: Screenshot reference (desktop)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1280,900 \
            --virtual-time-budget=6000 \
            --screenshot=ref/ref-desktop.png \
            "https://01a1e914-01ee-7b69-8eb4-18988b026c39.arena.site/" || true
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: reference-snapshot
          path: ref
          retention-days: 1
